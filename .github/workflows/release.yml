name: Build and release SmartTube Mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: mobile-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this project's patched sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent release signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. Release builds require a permanent signing key; debug signing is never used."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mobile-release.jks"
          printf 'MOBILE_KEYSTORE_PATH=%s/mobile-release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set increasing production version
        run: |
          set -euo pipefail
          # Preserve the package ID. Every new run supersedes the previous run and legacy 23743 builds.
          echo "ORG_GRADLE_PROJECT_mobileVersionCode=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mobileVersionName=v1.0.${GITHUB_RUN_NUMBER}+st32.68" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'

      - name: Build signed mobile release APKs
        working-directory: SmarterTube
        env:
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon --console=plain --stacktrace :smarttubetv:assembleStmobileRelease

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp SmarterTube/smarttubetv/build/outputs/apk/stmobile/release/*.apk release-assets/
          for apk in release-assets/*.apk; do
            "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify "$apk"
            badging="$("$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging "$apk")"
            if grep -q '^application-debuggable' <<< "$badging"; then
              echo "::error::Refusing to publish a debuggable APK."
              exit 1
            fi
          done
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mobile-release.jks"

      - name: Publish APKs as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          cat > release-notes.md <<'EOF'
          Production release APKs built from this repository's patched sources.

          Choose `universal` for all included architectures, or an APK matching your device. SHA-256 checksums are attached.

          These APKs use this project's permanent release signing key and an increasing Android version code. Future releases signed with the same key can update this app in place, preserving local data.

          An older debug build can only be upgraded directly if it was signed with this same key. Android cannot update an existing installation with a different signing certificate.
          EOF
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Use a new tag or dispatch a new release; published APKs are immutable."
            exit 1
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SmartTube Mobile $tag" \
              --notes-file release-notes.md \
              --latest
          fi
