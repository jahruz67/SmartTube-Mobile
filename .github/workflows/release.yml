name: Build and release SmartTube Mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this project's patched sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: sdkmanager --install 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'

      - name: Build mobile debug APKs
        working-directory: SmarterTube
        run: |
          set -euo pipefail
          test ! -e keystore.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon --console=plain --stacktrace :smarttubetv:assembleStmobileDebug

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp SmarterTube/smarttubetv/build/outputs/apk/stmobile/debug/*.apk release-assets/
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish APKs as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="mobile-build-${GITHUB_RUN_NUMBER}"
          fi

          cat > release-notes.md <<'EOF'
          Mobile development APKs built from this repository's patched sources.

          Choose `universal` for all included architectures, or an APK matching your device. SHA-256 checksums are attached.

          These APKs use a temporary Android debug signing key. Builds from separate workflow runs may require uninstalling the previous app before installation, which removes its local data.
          EOF
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SmartTube Mobile $tag" \
              --notes-file release-notes.md \
              --prerelease
          fi
