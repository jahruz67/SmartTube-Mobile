name: Build SmartTube Mobile modified debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out this development kit
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false

      - name: Check out exact SmarterTube source and submodules
        uses: actions/checkout@v4
        with:
          repository: CodeSculptor/SmarterTube
          ref: 3b780e9a8ac62ba59c90d090fa46d87210c45525
          submodules: recursive
          persist-credentials: false
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK requested by upstream
        run: sdkmanager --install 'ndk;21.0.6113669'

      - name: Verify source and build tooling provenance
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = '3b780e9a8ac62ba59c90d090fa46d87210c45525'
          test ! -e keystore.properties
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo 'Submodule revisions:'
            git submodule status --recursive
            echo 'Gradle wrapper SHA256:'
            sha256sum gradle/wrapper/gradle-wrapper.jar
            echo 'Java runtime:'
            java -version 2>&1
          } > ../provenance.txt

      - name: Run source-patch structural tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s kit/tests -v 2>&1 | tee patch-tests.log

      - name: Apply bottom navigation and independent development identity
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/scripts/apply-bottom-navigation.py source 2>&1 | tee mobile-ui-patch.log
          python3 kit/scripts/apply-development-identity.py source 2>&1 | tee development-identity.log
          python3 kit/scripts/install-mobile-smoke-test.py source 2>&1 | tee instrumentation-install.log
          python3 kit/scripts/apply-build-compatibility.py source 2>&1 | tee build-compatibility.log
          git -C source add -N -- smarttubetv/src/stmobile/res/values/mobile_bottom_nav_strings.xml smarttubetv/src/androidTestStmobile/java/dev/smarttubemobile/tests/MobileBottomNavigationInstrumentationTest.java smarttubetv/src/stmobile/res/mipmap-mdpi/smarttube_mobile_dev_icon.png smarttubetv/src/stmobile/res/mipmap-hdpi/smarttube_mobile_dev_icon.png smarttubetv/src/stmobile/res/mipmap-xhdpi/smarttube_mobile_dev_icon.png smarttubetv/src/stmobile/res/mipmap-xxhdpi/smarttube_mobile_dev_icon.png smarttubetv/src/stmobile/res/mipmap-xxxhdpi/smarttube_mobile_dev_icon.png
          git -C source diff --binary -- smarttubetv/build.gradle smarttubetv/src/stmobile/ smarttubetv/src/androidTestStmobile/ > MOBILE_UI.patch
          git -C source status --short > post-patch-status.txt
          sha256sum source/smarttubetv/src/stmobile/res/values/mobile_bottom_nav_strings.xml > mobile-strings-sha256.txt

      - name: Build modified Android phone APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug 2>&1 | tee ../build.log

      - name: Run Android JVM unit tests
        id: tests
        shell: bash
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace :smarttubetv:testStmobileDebugUnitTest 2>&1 | tee ../unit-tests.log

      - name: Record unit-test outcome
        if: always()
        run: echo "${{ steps.tests.outcome }}" > unit-test-status.txt

      - name: Inspect produced APK package, signature and ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          apk_dir='source/smarttubetv/build/outputs/apk/stmobile'
          test -d "$apk_dir"
          find "$apk_dir" -type f -name '*.apk' -print | sort > apk-files.txt
          test -s apk-files.txt
          while IFS= read -r apk; do
            sha256sum "$apk"
            python3 kit/scripts/inspect-apk.py "$apk" --package dev.smarttubemobile.unofficial
          done < apk-files.txt | tee apk-inspection.txt

      - name: Compile device tests without launching an emulator
        working-directory: source
        run: bash ./gradlew --no-daemon :common:testStmobileDebugUnitTest :smarttubetv:assembleStmobileDebugAndroidTest

      - name: Publish build results (no private signing material)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-mobile-debug-source-patched
          if-no-files-found: warn
          path: |
            source/smarttubetv/build/outputs/apk/stmobile/*.apk
            source/smarttubetv/build/outputs/apk/stmobile/**/*.apk
            provenance.txt
            MOBILE_UI.patch
            post-patch-status.txt
            mobile-strings-sha256.txt
            patch-tests.log
            mobile-ui-patch.log
            development-identity.log
            instrumentation-install.log
            build.log
            unit-tests.log
            unit-test-status.txt
            apk-files.txt
            apk-inspection.txt
            source/smarttubetv/build/reports/androidTests/connected/**
            source/smarttubetv/build/outputs/androidTest-results/connected/**
          retention-days: 14
